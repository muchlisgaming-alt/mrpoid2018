apply plugin: 'com.android.library'

android {
    // PENTING: Ganti 'com.mrpoid.lib' dengan nama package asli yang ada di 
    // file lib/src/main/AndroidManifest.xml (baris package="...")
    namespace 'com.mrpoid' 
    
    compileSdkVersion 34 // <--- DIUBAH DARI 27

    defaultConfig {
        minSdkVersion 17
        targetSdkVersion 34 // <--- DIUBAH DARI 26

        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your APK.
            abiFilters 'x86', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    // Tambahkan ini agar GitHub Actions mengunduh versi NDK yang stabil
    ndkVersion "25.1.8937393"

    // Encapsulates your external native build configurations.
    externalNativeBuild {

        // Encapsulates your CMake build configurations.
        cmake {
            // Provides a relative path to your CMake build script.
           // path "src/main/jni/CMakeLists.txt"
        }

        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    // Tambahkan ini untuk kompatibilitas Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // DIUBAH DARI com.android.support MENJADI ANDROIDX
    api 'androidx.appcompat:appcompat:1.6.1'
}
