# 3. Setup Android SDK
- name: Setup Android SDK
  uses: android-actions/setup-android@v3
  with:
    # Lewati instalasi paket default 'tools' yang bermasalah
    packages: ''
# 4. Instal paket yang dibutuhkan secara manual
- name: Install required SDK packages
  run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
# 5. Memberi izin eksekusi pada file gradlew
- name: Grant execute permission for gradlew
  run: chmod +x gradlew
# 6. Menjalankan Build
- name: Build with Gradle
  run: ./gradlew assembleDebug      run: ./gradlew assembleDebug
